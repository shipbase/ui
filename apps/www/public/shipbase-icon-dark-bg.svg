<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <rect width="32" height="32" fill="#000000" />
  <g transform="translate(4, 4) scale(0.03)">
    <!-- First triangle: 400px wide, 500px high -->
    <polygon points="0,500 400,0 400,500" fill="#FFFFFF" stroke="none" />
    <!-- Second triangle: 400px wide, 500px high, positioned at y=300 -->
    <polygon points="400,300 800,300 400,800" fill="#FFFFFF" stroke="none" />
  </g>
</svg>